<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yogasana Admin - Create Competition</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#E8F5E9',
              100: '#C8E6C9',
              200: '#A5D6A7',
              300: '#81C784',
              400: '#66BB6A',
              500: '#4CAF50',
              600: '#43A047',
              700: '#388E3C',
              800: '#2E7D32',
              900: '#1B5E20',
            }
          }
        }
      }
    }
  </script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Custom scrollbar for dense admin forms */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Helper SVG Icons
    const Icon = ({ name, size = 18, className = "" }) => {
      return <i data-lucide={name} className={`inline-block ${className}`} style={{ width: size, height: size }}></i>;
    };

    function App() {
      // Control options & screen state
      const [viewMode, setViewMode] = useState('filled'); // 'empty' | 'filled'
      const [showDevAnnotations, setShowDevAnnotations] = useState(true);
      const [isMobileView, setIsMobileView] = useState(false);

      // Modals
      const [showModeChooser, setShowModeChooser] = useState(false);
      const [modeChooserContext, setModeChooserContext] = useState('add'); // 'add' | 'configure'
      const [addCategoryStep, setAddCategoryStep] = useState('format'); // 'format' | 'name'
      const [pendingCategoryFormat, setPendingCategoryFormat] = useState(null); // 'asanas' | 'challenge'
      const [newCategoryName, setNewCategoryName] = useState('');
      const [selectedCategoryForConfig, setSelectedCategoryForConfig] = useState('COMMON');
      const [showAsanasConfig, setShowAsanasConfig] = useState(false);
      const [showChallengeAlert, setShowChallengeAlert] = useState(false);
      const [configWizardStep, setConfigWizardStep] = useState(1);

      const CONFIG_WIZARD_STEPS = [
        { id: 1, label: 'Stages', short: 'Stages' },
        { id: 2, label: 'Group Types', short: 'Groups' },
        { id: 3, label: 'Stage Allotment', short: 'Allot' },
        { id: 4, label: 'Participants & Marks', short: 'Marks' },
        { id: 5, label: 'Juries', short: 'Juries' },
        { id: 6, label: 'Asanas', short: 'Asanas' },
        { id: 7, label: 'Bend Types', short: 'Bends' },
        { id: 8, label: 'Prizes', short: 'Prizes' },
        { id: 9, label: 'Scoring', short: 'Scoring' },
        { id: 10, label: 'Viva Voce', short: 'Viva' },
        { id: 11, label: 'Compliments', short: 'Gifts' },
        { id: 12, label: 'Fees', short: 'Fees' }
      ];
      const TOTAL_CONFIG_STEPS = CONFIG_WIZARD_STEPS.length;

      // Form State - Screen 1
      const [compName, setCompName] = useState('12th National Yogasana Sports Championship 2026');
      const [description, setDescription] = useState('Annual state-level and national yoga competition featuring traditional, rhythmic, and artistic yoga asanas.');
      const [address, setAddress] = useState('Indoor Sports Complex, Stadium Road, Zone 4, New Delhi - 110001');
      
      const [startDate, setStartDate] = useState('2026-08-15');
      const [endDate, setEndDate] = useState('2026-08-17');
      const [displayAdFrom, setDisplayAdFrom] = useState('2026-08-01');
      const [startTime, setStartTime] = useState('08:00');
      const [endTime, setEndTime] = useState('18:00');
      const [publishNow, setPublishNow] = useState(false);
      const [publishTime, setPublishTime] = useState('2026-08-17T19:00');

      const [bestSchoolMin, setBestSchoolMin] = useState(15);
      const [compMode, setCompMode] = useState('offline'); // 'online' | 'offline' (Single mode selection)

      // Categories State
      const [categories, setCategories] = useState([
        { id: '1', name: 'COMMON', format: 'asanas', summary: 'Boys top 3 · Girls top 3 · Others top 1', status: 'Asanas', badgeColor: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
        { id: '2', name: 'SPECIAL', format: 'asanas', summary: 'Boys top 3 · Girls top 3 · Others top 1', status: 'Not configured', badgeColor: 'bg-amber-100 text-amber-800 border-amber-300' },
        { id: '3', name: 'ONE ASANA CHALLENGE', format: 'challenge', summary: 'Open for all age groups', status: 'Challenge', badgeColor: 'bg-sky-100 text-sky-800 border-sky-300' }
      ]);

      // Screen 4 Asanas Config Detailed Form State
      const [stageNaming, setStageNaming] = useState('alphabet'); // 'alphabet' | 'stages' | 'other'
      const [stageCount, setStageCount] = useState(4);
      const [groupType, setGroupType] = useState('Study'); // 'Study' | 'Age' | 'Level'
      
      const [selectedStudyGroups, setSelectedStudyGroups] = useState(['LKG', 'UKG', 'I', 'II', 'III', 'IV', 'V']);
      const [selectedAgeGroups, setSelectedAgeGroups] = useState(['5-8 yrs', '9-12 yrs', '13-16 yrs']);
      const [selectedLevels, setSelectedLevels] = useState(['Level 1', 'Level 2']);
      const [studyGroupOptions, setStudyGroupOptions] = useState(['LKG', 'UKG', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'UG', 'PG', 'Diploma']);
      const [ageGroupOptions, setAgeGroupOptions] = useState(['Below 5 yrs', '5-8 yrs', '9-12 yrs', '13-16 yrs', '17-25 yrs', '26-35 yrs', 'Above 35 yrs']);
      const [levelGroupOptions, setLevelGroupOptions] = useState(['Level 1', 'Level 2', 'Level 3', 'Level 4', 'Level 5']);

      const [allotments, setAllotments] = useState({
        'Stage A': ['I', 'II', 'III'],
        'Stage B': ['IV', 'V'],
        'Stage C': ['LKG', 'UKG'],
        'Stage D': []
      });

      const [participantsPerStage, setParticipantsPerStage] = useState('5');
      const [minMarks, setMinMarks] = useState('10');
      const [maxMarks, setMaxMarks] = useState('100');
      const [skippedAsanaEnabled, setSkippedAsanaEnabled] = useState(true);
      const [skippedAsanaCount, setSkippedAsanaCount] = useState('1');
      const [juriesPerStage, setJuriesPerStage] = useState('3');

      const [compulsoryAsanas, setCompulsoryAsanas] = useState('4');
      const [ownChoiceAsanas, setOwnChoiceAsanas] = useState('2');
      const [eachAsanaTime, setEachAsanaTime] = useState('1');

      const [bendTypes, setBendTypes] = useState({
        forward: true,
        backward: true,
        handBalance: true,
        legBalance: false,
        twisting: true
      });

      const [prizesTop, setPrizesTop] = useState({ boys: '3', girls: '3', others: '1' });
      const [scoringMethod, setScoringMethod] = useState('Marks'); // NONE | Marks | Grading | Timed | Timed + Scoring
      const [upgradeTop, setUpgradeTop] = useState('3');
      const [upgradeToCategory, setUpgradeToCategory] = useState('SPECIAL');

      const [minTime, setMinTime] = useState('01:00');
      const [maxTime, setMaxTime] = useState('03:00');

      const [vivaVoceQuestions, setVivaVoceQuestions] = useState([
        { id: 1, question: 'Define Asana according to Patanjali Yoga Sutras.', answer: 'Sthira Sukham Asanam.', minMarks: '2', maxMarks: '5' }
      ]);

      const [topCompliments, setTopCompliments] = useState(['e-Certificate', 'Certificate', 'Medal', 'Trophy']);
      const [nonTopCompliments, setNonTopCompliments] = useState(['e-Certificate', 'Certificate']);

      const [feeAmount, setFeeAmount] = useState('500');
      const [includeFeeInRegistration, setIncludeFeeInRegistration] = useState(true);

      // Re-render icons on state update
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [viewMode, showModeChooser, showAsanasConfig, showChallengeAlert, isMobileView, vivaVoceQuestions, stageCount, stageNaming, configWizardStep, studyGroupOptions, ageGroupOptions, levelGroupOptions, addCategoryStep]);

      // Stage Chips Generator
      const generatedStages = useMemo(() => {
        const count = Math.max(1, Math.min(26, parseInt(stageCount) || 1));
        const list = [];
        for (let i = 0; i < count; i++) {
          if (stageNaming === 'alphabet') {
            list.push(`Stage ${String.fromCharCode(65 + i)}`);
          } else if (stageNaming === 'stages') {
            list.push(`Stage ${i + 1}`);
          } else {
            list.push(`Zone ${i + 1}`);
          }
        }
        return list;
      }, [stageNaming, stageCount]);

      const openCategoryConfig = (cat) => {
        setSelectedCategoryForConfig(cat.name);
        if (cat.format === 'challenge') {
          setShowChallengeAlert(true);
        } else {
          setConfigWizardStep(1);
          setShowAsanasConfig(true);
        }
      };

      // Add Category: format first, then name
      const handleAddCategory = () => {
        setModeChooserContext('add');
        setAddCategoryStep('format');
        setPendingCategoryFormat(null);
        setNewCategoryName('');
        setShowModeChooser(true);
      };

      // Existing category: skip format chooser, open config directly
      const handleCategoryCardClick = (cat) => {
        openCategoryConfig(cat);
      };

      const handleDeleteCategory = (id, e) => {
        e.stopPropagation();
        setCategories(categories.filter(cat => cat.id !== id));
      };

      const handleSelectMode = (mode) => {
        if (modeChooserContext === 'add') {
          setPendingCategoryFormat(mode);
          setAddCategoryStep('name');
          return;
        }
        setShowModeChooser(false);
        if (mode === 'asanas') {
          setConfigWizardStep(1);
          setShowAsanasConfig(true);
        } else if (mode === 'challenge') {
          setShowChallengeAlert(true);
        }
      };

      const handleConfirmNewCategory = () => {
        const trimmed = newCategoryName.trim();
        if (!trimmed) {
          alert('Please enter a category name.');
          return;
        }
        const format = pendingCategoryFormat || 'asanas';
        const newCat = {
          id: Date.now().toString(),
          name: trimmed.toUpperCase(),
          format,
          summary: format === 'challenge' ? 'Open for all age groups' : 'Boys top 3 · Girls top 3 · Others top 1',
          status: format === 'challenge' ? 'Challenge' : 'Not configured',
          badgeColor: format === 'challenge'
            ? 'bg-sky-100 text-sky-800 border-sky-300'
            : 'bg-amber-100 text-amber-800 border-amber-300'
        };
        setCategories([...categories, newCat]);
        setShowModeChooser(false);
        setAddCategoryStep('format');
        setNewCategoryName('');
        setPendingCategoryFormat(null);
        setViewMode('filled');
        openCategoryConfig(newCat);
      };

      const handleCloseModeChooser = () => {
        setShowModeChooser(false);
        setAddCategoryStep('format');
        setPendingCategoryFormat(null);
        setNewCategoryName('');
      };

      const handleConfigWizardNext = () => {
        setConfigWizardStep((s) => Math.min(TOTAL_CONFIG_STEPS, s + 1));
      };

      const handleConfigWizardPrev = () => {
        setConfigWizardStep((s) => Math.max(1, s - 1));
      };

      const handleAddGroupChip = () => {
        const label = prompt(
          groupType === 'Study' ? 'Add study class / group:' :
          groupType === 'Age' ? 'Add age range (e.g. 40-50 yrs):' :
          'Add difficulty level:'
        );
        if (!label || !label.trim()) return;
        const value = label.trim();
        if (groupType === 'Study') {
          if (!studyGroupOptions.includes(value)) setStudyGroupOptions([...studyGroupOptions, value]);
          if (!selectedStudyGroups.includes(value)) setSelectedStudyGroups([...selectedStudyGroups, value]);
        } else if (groupType === 'Age') {
          if (!ageGroupOptions.includes(value)) setAgeGroupOptions([...ageGroupOptions, value]);
          if (!selectedAgeGroups.includes(value)) setSelectedAgeGroups([...selectedAgeGroups, value]);
        } else {
          if (!levelGroupOptions.includes(value)) setLevelGroupOptions([...levelGroupOptions, value]);
          if (!selectedLevels.includes(value)) setSelectedLevels([...selectedLevels, value]);
        }
      };

      const handleSaveAsanasConfig = () => {
        setCategories(categories.map((cat) =>
          cat.name === selectedCategoryForConfig
            ? { ...cat, status: 'Asanas', badgeColor: 'bg-emerald-100 text-emerald-800 border-emerald-300', format: 'asanas' }
            : cat
        ));
        setShowAsanasConfig(false);
        setConfigWizardStep(1);
        alert(`Configuration for ${selectedCategoryForConfig} saved successfully!`);
      };

      const handleAddVivaRow = () => {
        setVivaVoceQuestions([
          ...vivaVoceQuestions,
          { id: Date.now(), question: '', answer: '', minMarks: '1', maxMarks: '5' }
        ]);
      };

      const handleRemoveVivaRow = (id) => {
        setVivaVoceQuestions(vivaVoceQuestions.filter(q => q.id !== id));
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-100 text-slate-800 pb-24">
          
          {/* TOP GLOBAL NAVBAR */}
          <header className="bg-teal-800 text-white shadow-md sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-lg bg-teal-600 border border-teal-400 flex items-center justify-center font-bold text-lg text-white shadow-inner">
                  🧘‍♀️
                </div>
                <div>
                  <h1 className="font-bold text-base tracking-wide text-white leading-none">YOGASANA SPORTS ADMIN</h1>
                  <p className="text-xs text-teal-200 mt-0.5">Competition Management Portal</p>
                </div>
              </div>

              {/* View Switcher & Demo Tools */}
              <div className="flex items-center gap-2 bg-teal-900/60 p-1.5 rounded-lg border border-teal-700/60 text-xs">
                <button
                  onClick={() => setViewMode('empty')}
                  className={`px-2.5 py-1 rounded font-medium transition ${viewMode === 'empty' ? 'bg-teal-500 text-white shadow' : 'text-teal-200 hover:text-white'}`}
                >
                  Screen 1 (Empty State)
                </button>
                <button
                  onClick={() => setViewMode('filled')}
                  className={`px-2.5 py-1 rounded font-medium transition ${viewMode === 'filled' ? 'bg-teal-500 text-white shadow' : 'text-teal-200 hover:text-white'}`}
                >
                  Screen 2 (Filled State)
                </button>

                <div className="h-4 w-px bg-teal-700 mx-1"></div>

                <label className="flex items-center gap-1.5 text-teal-100 cursor-pointer select-none px-1">
                  <input
                    type="checkbox"
                    checked={showDevAnnotations}
                    onChange={(e) => setShowDevAnnotations(e.target.checked)}
                    className="rounded text-teal-600 focus:ring-0"
                  />
                  <span>Dev Mapping Badges</span>
                </label>

                <button
                  onClick={() => setIsMobileView(!isMobileView)}
                  className={`px-2.5 py-1 rounded border flex items-center gap-1 transition ${isMobileView ? 'bg-amber-500 text-white border-amber-400' : 'bg-teal-800 text-teal-200 border-teal-600 hover:bg-teal-700'}`}
                >
                  <Icon name="smartphone" size={14} />
                  <span>{isMobileView ? 'Mobile View' : 'Desktop'}</span>
                </button>
              </div>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className={`flex-1 transition-all duration-300 mx-auto px-4 py-6 w-full ${isMobileView ? 'max-w-md' : 'max-w-7xl'}`}>

            {/* SCREEN HEADING */}
            <div className="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-2 border-b border-slate-200 pb-4">
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-xs font-semibold uppercase tracking-wider text-teal-700 bg-teal-50 border border-teal-200 px-2 py-0.5 rounded">Admin Dashboard</span>
                  {showDevAnnotations && (
                    <span className="text-xs font-mono bg-purple-100 text-purple-800 border border-purple-200 px-1.5 py-0.5 rounded">
                      [Main Page: Screen 1 / Screen 2]
                    </span>
                  )}
                </div>
                <h2 className="text-2xl font-black text-slate-900 tracking-tight mt-1 uppercase">CREATE COMPETITION</h2>
              </div>
              <p className="text-xs text-slate-500">Fields marked with <span className="text-red-500 font-bold">*</span> are required for official schedule publishing.</p>
            </div>

            {/* TWO COLUMN LAYOUT: MAIN FORM & RIGHT SIDEBAR */}
            <div className={`grid gap-6 ${isMobileView ? 'grid-cols-1' : 'grid-cols-1 lg:grid-cols-12'}`}>
              
              {/* LEFT / MAIN COLUMN FORM */}
              <div className={`${isMobileView ? 'col-span-1' : 'lg:col-span-8'} space-y-6`}>

                {/* 1. COMPETITION NAME */}
                <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm relative">
                  {showDevAnnotations && (
                    <span className="absolute right-3 top-3 text-[10px] font-mono bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded border">
                      [Form Section 1] Competition Name
                    </span>
                  )}
                  <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                    Competition Name <span className="text-red-500">*</span>
                  </label>
                  <input
                    type="text"
                    value={compName}
                    onChange={(e) => setCompName(e.target.value)}
                    placeholder="e.g. 12th National Yogasana Championship 2026"
                    className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-900 font-medium focus:ring-2 focus:ring-teal-600 focus:bg-white focus:outline-none transition"
                  />
                </div>

                {/* 2. DESCRIPTION */}
                <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm relative">
                  {showDevAnnotations && (
                    <span className="absolute right-3 top-3 text-[10px] font-mono bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded border">
                      [Form Section 2] Description
                    </span>
                  )}
                  <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                    Description
                  </label>
                  <textarea
                    rows={3}
                    value={description}
                    onChange={(e) => setDescription(e.target.value)}
                    placeholder="Provide details about the competition scope, guidelines, or organizing body..."
                    className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-900 focus:ring-2 focus:ring-teal-600 focus:bg-white focus:outline-none transition"
                  />
                </div>

                {/* 3. ADDRESS */}
                <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm relative">
                  {showDevAnnotations && (
                    <span className="absolute right-3 top-3 text-[10px] font-mono bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded border">
                      [Form Section 3] Address
                    </span>
                  )}
                  <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                    Address / Venue Details <span className="text-red-500">*</span>
                  </label>
                  <textarea
                    rows={2}
                    value={address}
                    onChange={(e) => setAddress(e.target.value)}
                    placeholder="Full physical venue location or online link details..."
                    className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-900 focus:ring-2 focus:ring-teal-600 focus:bg-white focus:outline-none transition"
                  />
                </div>

                {/* 4. EVENT DETAILS CARD */}
                <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm relative space-y-4">
                  {showDevAnnotations && (
                    <span className="absolute right-3 top-3 text-[10px] font-mono bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded border">
                      [Form Section 4] Event Details Card
                    </span>
                  )}
                  <div className="flex items-center gap-2 border-b border-slate-100 pb-2">
                    <Icon name="calendar" size={18} className="text-teal-700" />
                    <h3 className="text-sm font-bold uppercase tracking-wider text-slate-800">Event Schedule & Publishing</h3>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Event Start Date</label>
                      <input
                        type="date"
                        value={startDate}
                        onChange={(e) => setStartDate(e.target.value)}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-600 focus:bg-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Event End Date</label>
                      <input
                        type="date"
                        value={endDate}
                        onChange={(e) => setEndDate(e.target.value)}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-600 focus:bg-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Display Ad From</label>
                      <input
                        type="date"
                        value={displayAdFrom}
                        onChange={(e) => setDisplayAdFrom(e.target.value)}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-600 focus:bg-white"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-1">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Event Start Time</label>
                      <input
                        type="time"
                        value={startTime}
                        onChange={(e) => setStartTime(e.target.value)}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-600 focus:bg-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Event End Time</label>
                      <input
                        type="time"
                        value={endTime}
                        onChange={(e) => setEndTime(e.target.value)}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-600 focus:bg-white"
                      />
                    </div>
                  </div>

                  <div className="pt-2 border-t border-slate-100 grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
                    <label className="flex items-center gap-2 cursor-pointer select-none">
                      <input
                        type="checkbox"
                        checked={publishNow}
                        onChange={(e) => setPublishNow(e.target.checked)}
                        className="w-4 h-4 text-teal-600 rounded border-slate-300 focus:ring-teal-500"
                      />
                      <span className="text-sm font-semibold text-slate-800">Publish the result now</span>
                    </label>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Results Publish Time</label>
                      <input
                        type="datetime-local"
                        disabled={publishNow}
                        value={publishTime}
                        onChange={(e) => setPublishTime(e.target.value)}
                        className={`w-full px-3 py-2 border rounded-lg text-sm ${publishNow ? 'bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed' : 'bg-slate-50 border-slate-300 text-slate-800 focus:ring-2 focus:ring-teal-600'}`}
                      />
                    </div>

                                value={q.answer}
                                onChange={(e) => {
                                  const newQs = [...vivaVoceQuestions];
                                  newQs[idx].answer = e.target.value;
                                  setVivaVoceQuestions(newQs);
                                }}
                                className="px-3 py-1.5 bg-white border border-slate-300 rounded text-xs focus:ring-2 focus:ring-teal-600"
                              />
                            </div>

                            <div className="flex items-center gap-4 text-xs pt-1">
                              <div className="flex items-center gap-1.5">
                                <span className="text-slate-500">Min Marks:</span>
                                <select
                                  value={q.minMarks}
                                  onChange={(e) => {
                                    const newQs = [...vivaVoceQuestions];
                                    newQs[idx].minMarks = e.target.value;
                                    setVivaVoceQuestions(newQs);
                                  }}
                                  className="bg-white border border-slate-300 rounded px-2 py-0.5 font-bold"
                                >
                                  {[1,2,3,4,5].map(n => <option key={n} value={n}>{n}</option>)}
                                </select>
                              </div>

                              <div className="flex items-center gap-1.5">
                                <span className="text-slate-500">Max Marks:</span>
                                <select
                                  value={q.maxMarks}
                                  onChange={(e) => {
                                    const newQs = [...vivaVoceQuestions];
                                    newQs[idx].maxMarks = e.target.value;
                                    setVivaVoceQuestions(newQs);
                                  }}
                                  className="bg-white border border-slate-300 rounded px-2 py-0.5 font-bold"
                                >
                                  {[5,10,15,20].map(n => <option key={n} value={n}>{n}</option>)}
                                </select>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* STEP 11: COMPLIMENTS (Top + Non-Top) */}
                  {configWizardStep === 11 && (
                    <div className="space-y-4">
                      <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm relative">
                        {showDevAnnotations && (
                          <span className="absolute right-3 top-3 text-[10px] font-mono bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded border">
                            [Step 11] Top Compliments
                          </span>
                        )}
                        <h4 className="text-xs font-bold uppercase tracking-wider text-teal-800 mb-3 flex items-center gap-1.5">
                          <Icon name="gift" size={16} />
                          <span>11. Compliments for Top Participants</span>
                        </h4>

                        <div className="flex flex-wrap gap-2">
                          {['e-Certificate', 'Certificate', 'Medal', 'Trophy', 'Gold Coin', 'Bicycle', 'Cash Prize'].map((item) => {
                            const isSel = topCompliments.includes(item);
                            return (
                              <button
                                key={item}
                                type="button"
                                onClick={() => {
                                  if (isSel) setTopCompliments(topCompliments.filter(x => x !== item));
                                  else setTopCompliments([...topCompliments, item]);
                                }}
                                className={`px-3 py-1 rounded-full text-xs font-bold transition border ${isSel ? 'bg-teal-700 text-white border-teal-700' : 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200'}`}
                              >
                                {item}
                              </button>
                            );
                          })}
                          <button
                            type="button"
                            onClick={() => {
                              const custom = prompt("Add Custom Compliment:");
                              if (custom) setTopCompliments([...topCompliments, custom]);
                            }}
                            className="px-3 py-1 rounded-full text-xs font-bold bg-slate-200 text-slate-700 hover:bg-slate-300 border border-slate-300"
                          >
                            + Add Custom
                          </button>
                        </div>
                      </div>

                      <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm relative">
                        {showDevAnnotations && (
                          <span className="absolute right-3 top-3 text-[10px] font-mono bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded border">
                            [Step 11] Non-Top Compliments
                          </span>
                        )}
                        <h4 className="text-xs font-bold uppercase tracking-wider text-teal-800 mb-3 flex items-center gap-1.5">
                          <Icon name="smile" size={16} />
                          <span>Compliments for Non-Top Participants</span>
                        </h4>

                        <div className="flex flex-wrap gap-2">
                          {['e-Certificate', 'Certificate', 'Medal', 'Trophy', 'Participation Badge'].map((item) => {
                            const isSel = nonTopCompliments.includes(item);
                            return (
                              <button
                                key={item}
                                type="button"
                                onClick={() => {
                                  if (isSel) setNonTopCompliments(nonTopCompliments.filter(x => x !== item));
                                  else setNonTopCompliments([...nonTopCompliments, item]);
                                }}
                                className={`px-3 py-1 rounded-full text-xs font-bold transition border ${isSel ? 'bg-teal-700 text-white border-teal-700' : 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200'}`}
                              >
                                {item}
                              </button>
                            );
                          })}
                          <button
                            type="button"
                            onClick={() => {
                              const custom = prompt("Add Custom Compliment:");
                              if (custom) setNonTopCompliments([...nonTopCompliments, custom]);
                            }}
                            className="px-3 py-1 rounded-full text-xs font-bold bg-slate-200 text-slate-700 hover:bg-slate-300 border border-slate-300"
                          >
                            + Add Custom
                          </button>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* STEP 12: FEES */}
                  {configWizardStep === 12 && (
                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm relative space-y-3">
                      {showDevAnnotations && (
                        <span className="absolute right-3 top-3 text-[10px] font-mono bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded border">
                          [Step 12] Fees
                        </span>
                      )}
                      <h4 className="text-xs font-bold uppercase tracking-wider text-teal-800 mb-1 flex items-center gap-1.5">
                        <Icon name="indian-rupee" size={16} />
                        <span>12. Category Registration Fees</span>
                      </h4>

                      <div className="max-w-xs space-y-2">
                        <label className="block text-xs font-semibold text-slate-600">Amount per Participant</label>
                        <div className="relative">
                          <span className="absolute left-3 top-2.5 text-slate-500 font-bold text-sm">₹</span>
                          <input
                            type="number"
                            value={feeAmount}
                            onChange={(e) => setFeeAmount(e.target.value)}
                            className="w-full pl-8 pr-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-black text-slate-900 focus:ring-2 focus:ring-teal-600"
                          />
                        </div>

                        <label className="flex items-center gap-2 cursor-pointer select-none pt-1">
                          <input
                            type="checkbox"
                            checked={includeFeeInRegistration}
                            onChange={(e) => setIncludeFeeInRegistration(e.target.checked)}
                            className="w-4 h-4 text-teal-600 rounded border-slate-300 focus:ring-teal-500"
                          />
                          <span className="text-xs font-semibold text-slate-700">Include fee in registration form</span>
                        </label>

                        <p className="text-[11px] text-slate-500 pt-1">
                          Fee breakdown: Base ₹{feeAmount} + 18% GST (₹{(parseFloat(feeAmount || 0) * 0.18).toFixed(2)}) = <span className="font-bold text-slate-800">₹{(parseFloat(feeAmount || 0) * 1.18).toFixed(2)} total</span>
                        </p>
                      </div>
                    </div>
                  )}

                </div>

                {/* MODAL FOOTER — step-aware actions */}
                <div className="p-4 border-t border-slate-200 bg-white rounded-b-2xl flex items-center justify-between shrink-0 gap-3 flex-wrap">
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-slate-500">
                      Configuring: <strong className="text-teal-700">{selectedCategoryForConfig}</strong>
                    </span>
                    <span className="hidden sm:inline text-xs text-slate-400">·</span>
                    <span className="hidden sm:inline text-xs font-bold text-slate-600">
                      Step {configWizardStep} of {TOTAL_CONFIG_STEPS}
                    </span>
                  </div>

                  <div className="flex items-center gap-2 ml-auto">
                    <button
                      type="button"
                      onClick={() => { setShowAsanasConfig(false); setConfigWizardStep(1); }}
                      className="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg text-xs font-bold hover:bg-slate-100 transition"
                    >
                      Cancel
                    </button>

                    {configWizardStep > 1 && (
                      <button
                        type="button"
                        onClick={handleConfigWizardPrev}
                        className="px-4 py-2 border border-teal-300 text-teal-800 bg-teal-50 rounded-lg text-xs font-bold hover:bg-teal-100 transition flex items-center gap-1"
                      >
                        <Icon name="chevron-left" size={14} />
                        <span>Previous</span>
                      </button>
                    )}

                    {configWizardStep < TOTAL_CONFIG_STEPS ? (
                      <button
                        type="button"
                        onClick={handleConfigWizardNext}
                        className="px-5 py-2 bg-teal-700 text-white rounded-lg text-xs font-bold hover:bg-teal-800 transition shadow flex items-center gap-1"
                      >
                        <span>Next</span>
                        <Icon name="chevron-right" size={14} />
                      </button>
                    ) : (
                      <button
                        type="button"
                        onClick={handleSaveAsanasConfig}
                        className="px-5 py-2 bg-teal-700 text-white rounded-lg text-xs font-bold hover:bg-teal-800 transition shadow flex items-center gap-1"
                      >
                        <Icon name="check" size={14} />
                        <span>Save Configuration</span>
                      </button>
                    )}
                  </div>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
