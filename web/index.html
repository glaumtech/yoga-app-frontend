<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Yogo competition Application">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Yoga Competition Application">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Favicon (assets/images/yoga-icon.png) -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png"/>

  <title>Yoga Competition Application</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #4CAF50;
    }

    #flutter-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #4CAF50;
      color: #ffffff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }

    #flutter-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #flutter-loading .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: flutter-loading-spin 0.9s linear infinite;
      margin-bottom: 18px;
    }

    #flutter-loading h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      font-weight: 700;
    }

    #flutter-loading p {
      margin: 0;
      opacity: 0.85;
      font-size: 0.95rem;
    }

    @keyframes flutter-loading-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <script src='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs' type='module'></script>
  <script type='module'>
  var { pdfjsLib } = globalThis;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';

  var pdfRenderOptions = {
    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
    cMapPacked: true,
  }
  </script>
  <div id="flutter-loading" aria-live="polite" aria-busy="true">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Yogasana Championship</h1>
    <p>Loading application…</p>
  </div>

  <script>
    (function () {
      var loadingEl = document.getElementById('flutter-loading');

      function hideLoading() {
        if (!loadingEl) return;
        loadingEl.classList.add('hidden');
        loadingEl.setAttribute('aria-busy', 'false');
        setTimeout(function () {
          if (loadingEl && loadingEl.parentNode) {
            loadingEl.parentNode.removeChild(loadingEl);
          }
        }, 300);
      }

      window.addEventListener('flutter-first-frame', hideLoading);

      // Fallback: if Flutter never paints (e.g. dev server still compiling), hint the user.
      setTimeout(function () {
        if (!loadingEl || loadingEl.classList.contains('hidden')) return;
        var hint = loadingEl.querySelector('p');
        if (hint) {
          hint.textContent = 'Still loading… If this stays blank, refresh the page.';
        }
      }, 15000);
    })();
  </script>

  <script src="flutter_bootstrap.js"></script>
</body>
</html>
